<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · thanaphat.dev</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07080a; --ink:#f1f2ee; --muted:#8b919b; --line:#20242b; --lime:#c8f53c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "JetBrains Mono", monospace; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { max-width: 640px; width: 100%; }
  pre { color: var(--muted); font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .m { color: var(--lime); } .e { color: #ff8fa3; }
  h1 { font-family: "Kanit", sans-serif; font-weight: 800; font-size: clamp(96px, 26vw, 200px); line-height: .9; margin-top: 24px; }
  p { font-family: "Kanit", sans-serif; font-weight: 500; font-size: 22px; margin-top: 12px; }
  a { display: inline-block; margin-top: 32px; padding: 14px 26px; border-radius: 999px; background: var(--lime); color: #0b0d02; text-decoration: none; font-weight: 500; }
  a:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
</style>
</head>
<body>
<main>
<pre><span class="m">GET</span> <span id="path">/this-page</span>
<span class="e">HTTP/1.1 404 Not Found</span></pre>
<h1>404</h1>
<p>ไม่พบหน้านี้ · Route not found</p>
<a href="./">← กลับหน้าแรก</a>
</main>
<script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
